name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 0.1.0）；留空用 package.json 的"
        required: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - run: npm ci
      - run: npm test

      - name: npm publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version || '0.1.0' }}
          name: v${{ github.event.inputs.version || '0.1.0' }}
          generate_release_notes: true
